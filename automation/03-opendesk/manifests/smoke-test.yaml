# Acceptance test of the base services (doc 03, section 8.1):
# Longhorn volume mounted in a pod, certificate, nginx behind HAProxy Ingress.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-vol
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "echo longhorn-ok > /data/test.txt && cat /data/test.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: smoke-pvc
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smoke-cert
spec:
  secretName: smoke-cert-tls
  commonName: smoke.@DOMAIN@
  dnsNames:
    - smoke.@DOMAIN@
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-nginx
spec:
  replicas: 1
  selector: {matchLabels: {app: smoke-nginx}}
  template:
    metadata: {labels: {app: smoke-nginx}}
    spec:
      containers:
        - {name: nginx, image: "nginx:stable", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-nginx
spec:
  selector: {app: smoke-nginx}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoke-ingress
spec:                       # no ingressClassName: tests the default class
  rules:
    - host: smoke.@DOMAIN@
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke-nginx
                port:
                  number: 80
